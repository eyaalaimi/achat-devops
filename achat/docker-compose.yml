version: '3.8'

services:
  # Service de l'application Spring Boot
  app:
    build: .
    container_name: achat-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/achat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - achat-network

  # Service de la base de données MySQL
  db:
    image: mysql:8
    container_name: achat-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=achat_db
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - achat-network

# Volumes pour persister les données
volumes:
  mysql-data:

# Réseau pour la communication entre conteneurs
networks:
  achat-network:
    driver: bridge
