version: '3.8'

# Networks
networks:
  devops-network:
    driver: bridge

# Volumes for data persistence
volumes:
  mysql-data:
  jenkins-data:
  sonar-data:
  sonar-extensions:
  nexus-data:

services:
  # ========== 1. MYSQL DATABASE ==========
  mysql-db:
    image: mysql:8.0
    container_name: achat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: achat_db
      MYSQL_USER: achat_user
      MYSQL_PASSWORD: achat123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ========== 2. JENKINS ==========
  jenkins:
    image: jenkins/jenkins:lts-jdk11
    container_name: achat-jenkins
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-network
    depends_on:
      - nexus
      - sonarqube

  # ========== 3. SONARQUBE ==========
  sonarqube:
    image: sonarqube:latest
    container_name: achat-sonarqube
    restart: unless-stopped
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar123
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
    networks:
      - devops-network
    depends_on:
      - sonar-db

  # PostgreSQL for SonarQube
  sonar-db:
    image: postgres:13
    container_name: achat-sonardb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar123
      - POSTGRES_DB=sonar
    volumes:
      - sonar-data:/var/lib/postgresql/data
    networks:
      - devops-network

  # ========== 4. NEXUS ==========
  nexus:
    image: sonatype/nexus3
    container_name: achat-nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - devops-network

  # ========== 5. ACHAT APPLICATION ==========
  achat-app:
    build: .
    container_name: achat-application
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/achat_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - devops-network
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
